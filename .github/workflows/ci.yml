name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The snapshot goldens match one exact simulator pixel for pixel, so pin the
# Xcode and the test destination instead of taking the runner's defaults.
# `xcode-27` is GitHub's public-preview runner image; see
# https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build:
    name: Build
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: |
          xcodebuild build \
            -scheme WhiskrKit \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  playground:
    name: Build Playground example
    runs-on: xcode-27
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project Examples/WhiskrKitPlayground/WhiskrKitPlayground.xcodeproj \
            -scheme WhiskrKitPlayground \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  test:
    name: Test
    runs-on: xcode-27
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Test
        run: |
          xcodebuild test \
            -scheme WhiskrKit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
